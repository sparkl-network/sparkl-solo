[package]
name = "sparkl-solo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.55", features = ["tokio", "identify", "kad", "mdns", "ping", "quic", "tcp", "noise", "yamux", "macros"] }
once_cell = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sled = "0.34"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
crypto_box = "0.9"
secp256k1 = { version = "0.31.1", default-features = false, features = ["recovery", "global-context"] }

[features]
# Default to laptop/CI-safe behavior so `cargo build` works without TPM tooling.
default = ["mock-tpm"]
# Software-only identity path; no TPM hardware/tooling required.
# Use for local development, CI, and tests.
mock-tpm = []
# Enables TPM-backed entropy path (`tpm2_getrandom`) in `identity.rs`.
# Requires TPM tooling/runtime (e.g. `swtpm` + `tpm2-tools` or hardware `/dev/tpm0`).
tpm = []
# Enables async receipt anchoring to Unicity testnet gateway.
unicity = []

[dev-dependencies]
tempfile = "3"
serial_test = "3"
