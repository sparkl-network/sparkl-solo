[node]
name = "sparkl-solo"
data_dir = "./.sparkl-data"
log_level = "info"
mode = "solo"
receipt_cadence_tokens = 50
include_models = []
exclude_models = []

[network]
# list of listen addresses for libp2p - TCP and QUIC
listen_addrs = ["/ip4/0.0.0.0/udp/30333/quic-v1", "/ip4/0.0.0.0/tcp/30333"]
# list of public addresses to advertise and inject into DHT
# public_addr = []
# expose /status/detail endpoint with peer+identity diagnostics
# default false: keep detailed internals private unless explicitly enabled
expose_status_detail = false
# inference port - ws and quic-v1 (planned)
inference_port = 9944
# list of bootstrap peers to dial
bootstrap_peers = [
  "/dns/boot.sparkl.network/tcp/51993/p2p/12D3KooWMr6gHBiC55poCBDRV9NcXcEfFjv4jEzA9s3cM81RyYmX",
  "/dns/boot.sparkl.network/tcp/52003/p2p/12D3KooWMHkKisRr7jhXUtpN1qasUwZmLZwsU8cEQ1Hb75LhS2xL"
]
# allow non-global addresses to be inserted into DHT
# default: false - could leak local addresses to the public DHT
allow_non_globals_in_dht = false
# advertised public IP address (recommended behind NAT)
# external_ip = "127.0.0.1"

[backend]
url = "http://127.0.0.1:11434"
health_path = "/health"
models_path = "/v1/models"
timeout_secs = 120

[attestation]
nras_url = "https://nras.attestation.nvidia.com"
nras_enabled = false
cert_ttl_days = 7

[registry]
unicity_aggregator_url = "https://aggregator.unicity.network/"
heartbeat_secs = 30
enabled = false

[settlement]
epoch_secs = 600
evm_rpc_url = "https://mainnet.base.org"
escrow_contract = "0x0000000000000000000000000000000000000000"
enabled = false

[pricing]
micro_usd_per_m_input_tokens = 100
micro_usd_per_m_output_tokens = 780
