[node]
name = "sparkl-solo"
data_dir = "./.sparkl-data"
log_level = "info"
mode = "solo"
receipt_cadence_tokens = 50
include_models = []
exclude_models = []
# Session security tier for inference (`best_effort` | `tee_verified`).
session_security_tier = "best_effort"

[network]
# list of listen addresses for libp2p - TCP and QUIC
listen_addrs = [
  "/ip4/0.0.0.0/udp/30333/quic-v1",
  "/ip4/0.0.0.0/tcp/30333",
]
# list of public addresses to advertise and inject into DHT
# public_addr = []
# expose /status/detail endpoint with peer+identity diagnostics
# default false: keep detailed internals private unless explicitly enabled
expose_status_detail = false
# inference port - ws and quic-v1 (planned)
inference_port = 9944
# list of bootstrap peers to dial
bootstrap_peers = [
  "/dns/boot.sparkl.network/tcp/51993/p2p/12D3KooWMr6gHBiC55poCBDRV9NcXcEfFjv4jEzA9s3cM81RyYmX",
  "/dns/boot.sparkl.network/tcp/52003/p2p/12D3KooWMHkKisRr7jhXUtpN1qasUwZmLZwsU8cEQ1Hb75LhS2xL"
]
# allow non-global addresses to be inserted into DHT
# default: false - could leak local addresses to the public DHT
allow_non_globals_in_dht = false
# advertised public IP address (recommended behind NAT)
# external_ip = "127.0.0.1"

[backend]
url = "http://127.0.0.1:1234/v1"
health_path = "/health"
models_path = "/v1/models"
timeout_secs = 120

[attestation]
nras_url = "https://nras.attestation.nvidia.com"
nras_enabled = false
cert_ttl_days = 7
# Optional: operator-supplied quote/signature for NVIDIA NRAS `full_attestation_flow` (typically from host TEE tooling).
nras_quote_hex = ""
nras_signature_hex = ""

[registry]
# Hub EVM ProviderRegistry. When `evm-settlement` is enabled and `src/network_config.rs`
# `SPARKL_NETWORK_CONFIG_ADDRESS` is set to the deployed `SparklNetworkConfig` (CREATE2), the
# binary overwrites this from the bootstrap contract at startup; otherwise set it here or via CLI.
registry_contract_address = "0x0000000000000000000000000000000000000000"
# Optional: JSON-RPC URL for registry only. Empty = use settlement.evm_rpc_url.
evm_rpc_url = ""
heartbeat_secs = 30
enabled = false

[settlement]
epoch_secs = 600
# Polkadot Hub EVM (pallet_revive) — replace with your RPC
evm_rpc_url = "https://eth-asset-hub-paseo.dotters.network"
# SettlementEscrow on Hub EVM. With `evm-settlement` + non-zero `SPARKL_NETWORK_CONFIG_ADDRESS`, startup
# may overwrite this from the bootstrap contract; otherwise set here or `--escrow-contract`.
escrow_contract = "0x0000000000000000000000000000000000000000"
# Bootstrap `SparklNetworkConfig` (overrides compile-time `SPARKL_NETWORK_CONFIG_ADDRESS` when non-empty).
# Leave empty for production binaries that bake the address in `src/network_config.rs` (see `contracts/deployments/paseo.json`).
# `--sparkl-network-config-address` wins over this field.
sparkl_network_config_address = ""
# Required when building with `--features evm-settlement` and settlement.enabled = true:
enabled = false
# Node operator key — must match registry.nodeOperator(nodeId) for each settled session's nodeId.
# evm_provider_wallet_private_key = "0x..."
# evm_settlement_operator_wallet_private_key = "0x..."  # must match escrow.settlementOperator (set by registry owner)
# TEE-verified streaming settlement cadence (wall clock seconds).
tee_tick_secs = 60
# Minimum output-token delta since last TEE anchor before attempting partial settle.
tee_settle_tokens_threshold = 256
# Optional block throttle between TEE settle attempts (0 = disabled).
tee_settle_every_n_blocks = 0
# Minimum internal deposit when opening a session on-chain (18-dec internal units).
session_min_deposit = 1000000000000000000

[router]
# Dial sparkl-router outbound WSS tunnel (provider registers for consumer traffic).
enabled = false
# Full WebSocket URL; override with --router-url or SPARKLE_ROUTER__URL.
url = "wss://api.sparkl.network/node/connect"
reconnect_min_secs = 1
reconnect_max_secs = 60
# Empty → http://127.0.0.1:{network.inference_port}
local_inference_base = ""
