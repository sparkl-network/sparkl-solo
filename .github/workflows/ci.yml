name: CI
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --features mock-tpm
      - run: cargo build --features mock-tpm,evm-settlement
      - run: cargo clippy --features mock-tpm

      - run: cargo test --features mock-tpm
      # Compile tests with Unicity feature enabled without requiring live gateway availability.
      - run: cargo test --features unicity --no-run