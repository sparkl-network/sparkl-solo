# Builds and tests Solidity under contracts/ via Foundry — native toolchain (foundry-toolchain) and Docker.
#
# Docker uses a pinned ghcr digest (not :latest), which is often missing or stale on GHCR.
# Bump FOUNDRY_DOCKER_IMAGE when upgrading Foundry; keep roughly in line with native `version: stable`.
#
# Branch protection: require the check named "contracts" so merges are blocked unless both matrix legs pass.
# pull_request has no paths filter on purpose so the "contracts" check always runs and required status stays unambiguous.

name: contracts

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ghcr.io/foundry-rs/foundry:v1 multi-arch index (Pin to digest; avoid :latest — see book “Reproducible builds”.)
  FOUNDRY_DOCKER_IMAGE: ghcr.io/foundry-rs/foundry@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd

jobs:
  forge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: native
            use_docker: false
          - environment: docker
            use_docker: true

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: forge build + test (native)
        if: ${{ !matrix.use_docker }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge --version && forge build
        if: ${{ !matrix.use_docker }}

      - run: forge test -vv
        if: ${{ !matrix.use_docker }}

      - name: forge build + test (Docker)
        if: ${{ matrix.use_docker }}
        run: |
          # Match host checkout uid/gid so forge can write `out/` on the bind mount (image user ≠ runner).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/contracts":/work \
            -w /work \
            --entrypoint forge \
            "$FOUNDRY_DOCKER_IMAGE" \
            build
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/contracts":/work \
            -w /work \
            --entrypoint forge \
            "$FOUNDRY_DOCKER_IMAGE" \
            test -vv

  # Single required status: succeeds only if every forge matrix job succeeded.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    needs: [forge]
    if: always()
    steps:
      - name: Require forge jobs success
        run: |
          if [ "${{ needs.forge.result }}" != "success" ]; then
            echo "::error::contracts forge matrix failed (result=${{ needs.forge.result }})"
            exit 1
          fi
          echo "All forge matrix jobs passed."
