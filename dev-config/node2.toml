[node]
name = "local-node-2"
data_dir = "./dev-data/node2"
log_level = "info"
mode = "solo"
receipt_cadence_tokens = 50
include_models = []
exclude_models = []

[network]
listen_addrs = ["/ip4/127.0.0.1/tcp/31002"]
inference_port = 19945
bootstrap_peers = [
  "/ip4/127.0.0.1/tcp/31001/p2p/12D3KooWCvGrTAkNbjoxWoWjHMngKwV9TKHLWUyA51uF3NCX43CB",
  "/dns/boot.sparkl.network/tcp/51993/p2p/12D3KooWMr6gHBiC55poCBDRV9NcXcEfFjv4jEzA9s3cM81RyYmX"
