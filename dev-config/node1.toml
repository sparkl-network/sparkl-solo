[node]
name = "local-node-1"
data_dir = "./dev-data/node1"
log_level = "info"
mode = "solo"
receipt_cadence_tokens = 50
include_models = []
exclude_models = []

[network]
listen_addrs = ["/ip4/127.0.0.1/tcp/31001"]
inference_port = 19944
bootstrap_peers = [
    # "/dns/boot.sparkl.network/tcp/51993/p2p/12D3KooWMr6gHBiC55poCBDRV9NcXcEfFjv4jEzA9s3cM81RyYmX",
  "/dns/boot.sparkl.network/tcp/52003/p2p/12D3KooWMHkKisRr7jhXUtpN1qasUwZmLZwsU8cEQ1Hb75LhS2xL"
]
public_addr = []
expose_status_detail = true
allow_non_globals_in_dht = true

[backend]
url = "http://127.0.0.1:1234"
health_path = "/health"
models_path = "/v1/models"
timeout_secs = 120

[attestation]
nras_url = "https://nras.attestation.nvidia.com"
nras_enabled = false
cert_ttl_days = 7

[registry]
registry_contract_address = "0x0000000000000000000000000000000000000000"
evm_rpc_url = ""
heartbeat_secs = 30
enabled = false

[router]
enabled = false
url = "ws://127.0.0.1:3001/node/connect"
reconnect_min_secs = 1
reconnect_max_secs = 60
local_inference_base = ""

[settlement]
epoch_secs = 600
evm_rpc_url = "https://YOUR_POLKADOT_HUB_EVM_RPC"
escrow_contract = "0x0000000000000000000000000000000000000000"
enabled = false
